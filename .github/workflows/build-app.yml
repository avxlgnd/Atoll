name: Build Atoll app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Metal Toolchain
        run: |
          sudo xcodebuild -runFirstLaunch || true
          for i in 1 2 3 4 5; do
            if sudo xcodebuild -downloadComponent MetalToolchain; then break; fi
            sleep 10
          done

      - name: Build
        run: |
          set -o pipefail
          # An ad-hoc signed app is killed by macOS if it keeps this entitlement.
          plutil -remove com.apple.security.mach-services DynamicIsland/DynamicIsland.entitlements 2>/dev/null || true

          xcodebuild build \
            -project DynamicIsland.xcodeproj \
            -scheme DynamicIsland \
            -destination "platform=macOS" \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES \
            2>&1 | tee build.log | tail -n 40

      - name: Zip the app
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          echo "Found app: $APP"
          xattr -cr "$APP"
          ditto -c -k --keepParent "$APP" Atoll-app.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Atoll-app
          path: Atoll-app.zip

      - name: Show errors if the build failed
        if: failure()
        run: grep -E "error:" build.log | head -n 40 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
